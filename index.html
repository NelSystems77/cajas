<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Cajas — Control de empaques</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Si algo falla antes de que React pinte, mostrar el error en vez de una página en blanco.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root')
        if (r && !r.children.length) r.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;font:14px monospace">Error al iniciar la app:\n' + (e.message || e) + '</pre>'
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
